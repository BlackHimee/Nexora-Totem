# Compile les deux plugins à chaque push et met les jars à disposition
# dans l'onglet « Actions » du dépôt GitHub (section « Artifacts » de chaque exécution).
name: Build Nexora Analytics

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilation
        run: mvn -B clean package

      - name: Mise à disposition des jars
        uses: actions/upload-artifact@v4
        with:
          name: NexoraAnalytics-jars
          path: |
            velocity/target/NexoraAnalytics-Velocity-*.jar
            paper/target/NexoraAnalytics-Paper-*.jar
            !velocity/target/original-*.jar
          if-no-files-found: error
