# =====================================================================
#  Nexora Analytics - configuration du proxy Velocity
# =====================================================================

# Adresse et port d'ecoute du serveur web (dashboard + reception des donnees Paper).
bind-address=0.0.0.0
port=8765

# URL a laquelle les admins accedent au dashboard depuis leur navigateur.
# Elle sert a construire le lien cliquable envoye par /analytics.
# Exemples : http://123.45.67.89:8765  ou  https://analytics.mon-serveur.fr
public-url=http://127.0.0.1:8765

# Secret partage avec les serveurs Paper (a recopier dans leur config.yml).
# Genere automatiquement au premier demarrage : ne le communiquez a personne.
ingest-secret=CHANGE-ME

# Fuseau horaire utilise pour decouper les journees (joueurs du jour, heures de pointe...).
timezone=Europe/Paris

# Duree de validite d'une session du dashboard (heures).
session-hours=12

# Duree de validite du lien genere par /analytics (minutes). Le lien est a usage unique.
token-minutes=5

# Frequence d'echantillonnage du nombre de joueurs en ligne (secondes).
sample-interval-seconds=60

# Frequence de verification de l'etat des serveurs du reseau (secondes).
ping-interval-seconds=30

# Nombre de jours sans connexion au-dela duquel un joueur est considere comme inactif.
inactive-after-days=7

# Conservation des echantillons de joueurs en ligne et des incidents (jours).
sample-retention-days=120
incident-retention-days=60
