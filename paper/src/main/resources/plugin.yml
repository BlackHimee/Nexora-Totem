name: NexoraAnalytics
version: '${project.version}'
main: fr.astra.nexora.analytics.paper.NexoraAnalyticsPaper
api-version: '1.21'
author: Astra
description: Collecte les statistiques du serveur (économie, îles, ressources, santé, erreurs) pour le dashboard Nexora Analytics.
softdepend:
  - Vault
  - NexoraMc
commands:
  nanalytics:
    description: Diagnostic du collecteur Nexora Analytics
    usage: /nanalytics [test]
    permission: nexora.analytics.admin
permissions:
  nexora.analytics.admin:
    description: Accès au diagnostic Nexora Analytics
    default: op
